<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>IA MASIVA</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue-deep: #0B1E6D; --blue-mid: #1E3A8A; --blue-elec: #2F6BFF;
      --blue-dark: #050F3A; --black: #050505; --white: #FFFFFF;
      --gray: #D1D5DB; --cyan: #00E5FF; --green: #00FF9C;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--black); color: var(--white); line-height: 1.6; overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; font-family: inherit; }
    .hidden { display: none !important; }

    /* ─── NAVBAR (incluye filtros) ───────────────────────────── */
    .app-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 5vw; height: 70px; background: rgba(5,15,58,0.98); border-bottom: 1px solid rgba(47,107,255,0.12); transition: background 0.3s; }
    .app-nav.scrolled { background: rgba(5,15,58,0.98); }
    .app-nav-left { display: flex; align-items: center; gap: 32px; min-width: 0; }
    .app-nav-logo { font-size: 1.6rem; font-weight: 900; letter-spacing: 0.1em; flex-shrink: 0; }
    .app-nav-filters { display: flex; align-items: center; gap: 10px; }
    .app-nav-right { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    .app-nav-name { font-size: 0.85rem; color: var(--gray); }
    .btn-nav { background: transparent; border: 1px solid rgba(47,107,255,0.4); color: var(--gray); padding: 8px 18px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; transition: all 0.2s; }
    .btn-nav:hover { background: rgba(47,107,255,0.15); border-color: var(--blue-elec); color: var(--white); }
    .btn-nav-primary { background: var(--blue-elec); border: none; color: var(--white); padding: 8px 18px; border-radius: 6px; font-size: 0.82rem; font-weight: 700; transition: background 0.2s; }
    .btn-nav-primary:hover { background: #4d7fff; }

    /* ─── FILTER PILLS ───────────────────────────────────────── */
    .filter-btn { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); color: var(--gray); padding: 7px 18px; border-radius: 20px; font-size: 0.82rem; font-weight: 600; transition: all 0.2s; white-space: nowrap; }
    .filter-btn:hover { background: rgba(255,255,255,0.14); color: var(--white); }
    .filter-btn.active { background: var(--white); color: #050F3A; border-color: var(--white); }
    .cat-dropdown { position: relative; }
    .cat-menu { position: absolute; top: calc(100% + 8px); left: 0; background: #0b1535; border: 1px solid rgba(47,107,255,0.22); border-radius: 10px; padding: 8px 0; min-width: 220px; box-shadow: 0 16px 40px rgba(0,0,0,0.6); display: none; flex-direction: column; z-index: 200; max-height: 320px; overflow-y: auto; }
    .cat-menu.open { display: flex; }
    .cat-menu-item { padding: 10px 18px; font-size: 0.86rem; color: var(--gray); cursor: pointer; transition: background 0.15s, color 0.15s; }
    .cat-menu-item:hover { background: rgba(47,107,255,0.1); color: var(--white); }
    .cat-menu-item.active { color: var(--blue-elec); font-weight: 700; }

    /* ─── HERO ───────────────────────────────────────────────── */
    .app-hero { position: relative; width: 100%; min-height: max(72vh, 460px); display: flex; align-items: flex-end; padding: 0 5vw 64px; overflow: hidden; background: linear-gradient(135deg, #050F3A 0%, #0B1E6D 55%, #1E3A8A 100%); padding-top: 104px; }
    .app-hero-bg { position: absolute; inset: 0; opacity: 0; transition: opacity 0.7s ease; }
    .app-hero-bg.visible { opacity: 1; }
    .app-hero-bg img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-edit-btn { position: absolute; top: 86px; right: 5vw; z-index: 4; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.25); background: rgba(5,5,5,0.55); backdrop-filter: blur(6px); color: var(--white); font-size: 1rem; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .hero-edit-btn:hover { background: rgba(47,107,255,0.35); border-color: var(--blue-elec); }
    .app-hero-dots { display: flex; gap: 8px; margin-top: 26px; }
    .hero-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.25); border: none; padding: 0; cursor: pointer; transition: background 0.2s, transform 0.2s; }
    .hero-dot:hover { background: rgba(255,255,255,0.5); }
    .hero-dot.active { background: var(--blue-elec); transform: scale(1.3); }
    .app-hero::before { content: ''; position: absolute; inset: 0; z-index: 1; background: linear-gradient(to right, rgba(5,15,58,0.6) 0%, rgba(5,15,58,0.1) 40%, transparent 65%), linear-gradient(to top, rgba(5,5,5,0.9) 0%, transparent 32%); }
    .app-hero::after { content: ''; position: absolute; inset: 0; z-index: 0; background-image: linear-gradient(rgba(47,107,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(47,107,255,0.04) 1px, transparent 1px); background-size: 60px 60px; mask-image: radial-gradient(ellipse at 70% 50%, transparent 30%, black 80%); }
    .app-hero-content { position: relative; z-index: 2; width: 100%; display: flex; flex-direction: column; align-items: center; }
    .app-hero.clickable { cursor: pointer; }
    .app-hero-empty { position: relative; z-index: 2; width: 100%; text-align: center; color: #9aacbf; font-size: 1rem; margin-bottom: 20px; }
    .app-hero-actions { display: flex; justify-content: center; width: 100%; }
    .app-btn-play { background: var(--blue-elec); color: var(--white); border: none; padding: 20px 56px; border-radius: 8px; font-size: 1.15rem; font-weight: 800; letter-spacing: 0.02em; display: flex; align-items: center; gap: 10px; transition: background 0.2s, transform 0.15s; box-shadow: 0 10px 30px rgba(47,107,255,0.4); }
    .app-btn-play:hover { background: #4d7fff; transform: translateY(-2px); }

    /* ─── CONTENT ────────────────────────────────────────────── */
    .app-content { background: var(--black); padding: 36px 5vw 80px; }
    .app-row { margin-bottom: 44px; }
    .app-row-title { font-size: 1.15rem; font-weight: 700; color: var(--white); margin-bottom: 4px; letter-spacing: 0.01em; }
    .scroll-wrapper { position: relative; }
    .app-track { display: flex; gap: 10px; overflow-x: auto; padding: 36px 14px 24px; scroll-behavior: smooth; scrollbar-width: none; -ms-overflow-style: none; }
    .app-track::-webkit-scrollbar { display: none; }
    .scroll-arrow { position: absolute; top: 50%; transform: translateY(-60%); z-index: 10; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(47,107,255,0.35); background: rgba(5,5,5,0.9); color: var(--white); font-size: 1rem; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(8px); transition: all 0.2s; }
    .scroll-arrow:hover { background: rgba(47,107,255,0.25); border-color: var(--blue-elec); box-shadow: 0 0 16px rgba(47,107,255,0.35); }
    .scroll-arrow.left { left: -20px; }
    .scroll-arrow.right { right: -20px; }

    /* ─── CARDS ──────────────────────────────────────────────── */
    .app-card { flex: 0 0 175px; height: 252px; border-radius: 10px; position: relative; overflow: hidden; cursor: pointer; border: 1px solid rgba(47,107,255,0.1); transition: transform 0.28s ease, box-shadow 0.28s ease, border-color 0.2s; }
    .app-card:hover { transform: scale(1.07) translateY(-7px); box-shadow: 0 22px 55px rgba(0,0,0,0.75), 0 0 0 1px rgba(47,107,255,0.5); border-color: rgba(47,107,255,0.5); z-index: 5; }
    .app-card:nth-child(1)  { background: linear-gradient(160deg, #060c2a 0%, #0e1f5c 100%); }
    .app-card:nth-child(2)  { background: linear-gradient(160deg, #050b26 0%, #091749 100%); }
    .app-card:nth-child(3)  { background: linear-gradient(160deg, #07102e 0%, #101d5e 100%); }
    .app-card:nth-child(4)  { background: linear-gradient(160deg, #060a25 0%, #0c1852 100%); }
    .app-card:nth-child(5)  { background: linear-gradient(160deg, #07102f 0%, #111f62 100%); }
    .app-card:nth-child(6)  { background: linear-gradient(160deg, #050d2a 0%, #0a1a55 100%); }
    .app-card:nth-child(7)  { background: linear-gradient(160deg, #060f2e 0%, #0f1e5f 100%); }
    .app-card:nth-child(8)  { background: linear-gradient(160deg, #050b26 0%, #0b1a50 100%); }
    .app-card:nth-child(9)  { background: linear-gradient(160deg, #060e2c 0%, #101d5c 100%); }
    .app-card:nth-child(10) { background: linear-gradient(160deg, #060c28 0%, #0e1c5a 100%); }
    .app-card-cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .app-card::before { content: ''; position: absolute; inset: 0; z-index: 1; background: radial-gradient(ellipse at 50% 10%, rgba(47,107,255,0.2) 0%, transparent 65%), linear-gradient(180deg, transparent 38%, rgba(5,5,5,0.95) 100%); }
    .app-card::after { content: ''; position: absolute; top: 0; left: 15%; right: 15%; height: 1.5px; background: linear-gradient(90deg, transparent, var(--blue-elec), transparent); opacity: 0.55; z-index: 2; }
    .app-card-rank { position: absolute; bottom: -12px; left: -2px; font-size: 5.8rem; font-weight: 900; line-height: 1; color: rgba(255,255,255,0.06); letter-spacing: -0.06em; user-select: none; pointer-events: none; z-index: 2; }
    .app-card-badge { position: absolute; top: 11px; right: 11px; font-size: 0.58rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 7px; border-radius: 4px; z-index: 3; }
    .badge-premium { background: rgba(47,107,255,0.14); border: 1px solid rgba(47,107,255,0.35); font-size: 0.85rem; letter-spacing: normal; text-transform: none; padding: 2px 6px; line-height: 1; }
    .badge-tuya    { background: rgba(0,229,255,0.12); border: 1px solid rgba(0,229,255,0.35); color: var(--cyan); }
    .app-card-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 30px 13px 14px; z-index: 3; }
    .app-card-tag  { font-size: 0.68rem; color: #4a6080; }
    .app-card.locked::before { background: rgba(5,5,5,0.4); }
    .app-card-lock { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -65%); font-size: 1.4rem; opacity: 0.45; z-index: 3; }
    .app-empty { color: #3d5268; font-size: 0.9rem; padding: 24px 0; font-style: italic; }

    /* ─── ADMIN CARD CONTROLS ────────────────────────────────── */
    .admin-card-controls { position: absolute; top: 8px; left: 8px; display: flex; gap: 5px; z-index: 10; opacity: 0; transition: opacity 0.2s; }
    .app-card:hover .admin-card-controls { opacity: 1; }
    .admin-card-btn { background: rgba(5,5,5,0.88); border: 1px solid rgba(47,107,255,0.3); border-radius: 5px; padding: 5px 8px; font-size: 0.75rem; font-weight: 700; backdrop-filter: blur(8px); transition: all 0.2s; }
    .admin-card-btn.edit { color: var(--blue-elec); }
    .admin-card-btn.edit:hover { background: rgba(47,107,255,0.2); }
    .admin-card-btn.del  { color: #ff6b6b; border-color: rgba(255,68,68,0.3); }
    .admin-card-btn.del:hover  { background: rgba(255,68,68,0.15); }

    /* ─── FILTERED VIEW ──────────────────────────────────────── */
    #filteredSection { display: none; }
    #filteredSection.active { display: block; }
    #mainSections.filtered { display: none; }

    /* ─── GUIDE VIEWER ──────────────────────────────────────── */
    .guide-overlay { position: fixed; inset: 0; z-index: 998; background: #000; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    .guide-overlay.active { opacity: 1; pointer-events: all; }
    .guide-topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 56px; background: rgba(5,15,58,0.98); border-bottom: 1px solid rgba(47,107,255,0.18); flex-shrink: 0; }
    .guide-topbar-title { font-size: 0.95rem; font-weight: 700; color: var(--white); }
    .guide-close { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); color: var(--white); padding: 7px 16px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .guide-close:hover { background: rgba(255,255,255,0.15); }
    .guide-frame { flex: 1; width: 100%; border: none; background: #fff; }

    /* ─── ADMIN MODAL ────────────────────────────────────────── */
    .modal-overlay { position: fixed; inset: 0; z-index: 999; background: rgba(5,5,5,0.88); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .modal { background: linear-gradient(160deg, #080f2e 0%, #0b1535 100%); border: 1px solid rgba(47,107,255,0.2); border-radius: 16px; padding: 36px; width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto; transform: translateY(16px); transition: transform 0.25s; }
    .modal-overlay.active .modal { transform: translateY(0); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
    .modal-title { font-size: 1.2rem; font-weight: 800; }
    .modal-close { background: none; border: none; color: #4f637a; font-size: 1.6rem; line-height: 1; padding: 4px 8px; transition: color 0.2s; }
    .modal-close:hover { color: var(--white); }
    .form-grid { display: flex; flex-direction: column; gap: 18px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-field label { display: block; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #637289; margin-bottom: 7px; }
    .form-field input[type="text"], .form-field input[type="number"], .form-field select, .form-field textarea { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1.5px solid rgba(47,107,255,0.22); background: rgba(5,5,5,0.6); color: var(--white); font-size: 0.92rem; outline: none; transition: border-color 0.2s; font-family: inherit; }
    .form-field textarea { min-height: 90px; resize: vertical; }
    .form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: var(--blue-elec); }
    .form-field input::placeholder, .form-field textarea::placeholder { color: #3d5268; }
    .toggle-row { display: flex; gap: 20px; }
    .toggle-label { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.9rem; color: var(--gray); user-select: none; }
    .toggle-label input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--blue-elec); }
    .file-upload { border: 1.5px dashed rgba(47,107,255,0.3); border-radius: 8px; padding: 18px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; }
    .file-upload:hover { border-color: var(--blue-elec); background: rgba(47,107,255,0.05); }
    .file-upload input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .file-upload-icon { font-size: 1.4rem; margin-bottom: 5px; }
    .file-upload-text { font-size: 0.8rem; color: #637289; }
    .file-name { font-size: 0.8rem; color: var(--blue-elec); margin-top: 5px; font-weight: 600; }
    .file-current { font-size: 0.75rem; color: #637289; margin-top: 5px; }
    .portada-preview { width: 100%; max-height: 110px; object-fit: cover; border-radius: 6px; margin-top: 10px; display: none; }
    .cats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .cat-check { display: flex; align-items: center; gap: 8px; font-size: 0.86rem; color: var(--gray); cursor: pointer; }
    .cat-check input { accent-color: var(--blue-elec); width: 15px; height: 15px; }
    .form-actions { display: flex; gap: 12px; justify-content: flex-end; }
    .btn-primary { background: var(--blue-elec); color: var(--white); border: none; padding: 11px 24px; border-radius: 8px; font-size: 0.9rem; font-weight: 700; transition: background 0.2s; }
    .btn-primary:hover { background: #4d7fff; }
    .btn-cancel { background: transparent; border: 1px solid rgba(255,255,255,0.12); color: var(--gray); padding: 11px 22px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; transition: all 0.2s; }
    .btn-cancel:hover { border-color: rgba(255,255,255,0.3); color: var(--white); }
    .form-msg { padding: 10px 14px; border-radius: 6px; font-size: 0.85rem; }
    .form-msg.error   { background: rgba(255,68,68,0.1); border: 1px solid rgba(255,68,68,0.3); color: #ff6b6b; }
    .form-msg.success { background: rgba(0,255,156,0.08); border: 1px solid rgba(0,255,156,0.22); color: var(--green); }

    /* ─── HERO SLIDES LIST (modal) ───────────────────────────── */
    .hero-slides-list { display: flex; flex-direction: column; gap: 8px; }
    .hero-slide-row { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 8px; border: 1px solid rgba(47,107,255,0.12); }
    .hero-slide-thumb { width: 72px; height: 40px; border-radius: 5px; object-fit: cover; background: #0e1f5c; flex-shrink: 0; }
    .hero-slide-info { flex: 1; min-width: 0; }
    .hero-slide-title { font-size: 0.86rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hero-slide-meta { font-size: 0.72rem; color: #637289; margin-top: 2px; }
    .hero-slide-empty { color: #3d5268; font-size: 0.85rem; padding: 12px 0; font-style: italic; }

    /* ─── RESPONSIVE ─────────────────────────────────────────── */
    @media (max-width: 720px) {
      .app-hero { min-height: max(58vh, 400px); padding-bottom: 44px; padding-top: 168px; }
      .hero-edit-btn { top: auto; bottom: 44px; right: 4vw; }
      .app-card { flex: 0 0 145px; height: 210px; }
      .app-card-rank { font-size: 4.5rem; }
      .app-nav-name { display: none; }
      .scroll-arrow { display: none; }
      .app-nav { flex-wrap: wrap; height: auto; padding: 14px 4vw 10px; row-gap: 10px; }
      .app-nav-left { width: 100%; flex-wrap: wrap; row-gap: 10px; }
      .app-nav-filters { flex-basis: 100%; overflow-x: auto; }
      .app-nav-filters::-webkit-scrollbar { display: none; }
      .app-nav-right { width: 100%; justify-content: flex-end; }
      .cats-grid { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- ═══ NAVBAR (logo + filtros) ═════════════════════════════ -->
  <nav class="app-nav" id="appNav">
    <div class="app-nav-left">
      <span class="app-nav-logo">IA MASIVA</span>
      <div class="app-nav-filters">
        <button class="filter-btn active" id="filterAll"     onclick="setFilter('all')">Todo</button>
        <button class="filter-btn"        id="filterGratis"  onclick="setFilter('gratis')">Gratis</button>
        <button class="filter-btn"        id="filterPremium" onclick="setFilter('premium')">Premium</button>
        <div class="cat-dropdown">
          <button class="filter-btn" id="filterCatBtn" onclick="toggleCatMenu()">Categorías ▾</button>
          <div class="cat-menu" id="catMenu"></div>
        </div>
      </div>
    </div>
    <div class="app-nav-right">
      <button class="btn-nav-primary hidden" id="btnNewGuide">+ Nueva guía</button>
      <span class="app-nav-name" id="appNavName"></span>
      <button class="btn-nav" id="appLogout">Salir</button>
    </div>
  </nav>

  <!-- ═══ HERO ═════════════════════════════════════════════════ -->
  <div class="app-hero" id="appHero">
    <button class="hero-edit-btn hidden" id="heroEditBtn" title="Editar imágenes del hero">&#9998;</button>
    <p class="app-hero-empty hidden" id="heroEmptyMsg">Muy pronto vas a ver aquí nuestros productos destacados.</p>
    <div class="app-hero-content">
      <div class="app-hero-actions">
        <button class="app-btn-play" id="heroBtn">Comprar ahora</button>
      </div>
      <div class="app-hero-dots" id="heroDots"></div>
    </div>
  </div>

  <!-- ═══ CONTENIDO ════════════════════════════════════════════ -->
  <div class="app-content">

    <!-- Vista filtrada -->
    <div id="filteredSection">
      <div class="app-row">
        <h2 class="app-row-title" id="filteredTitle">Resultados</h2>
        <div class="scroll-wrapper">
          <button class="scroll-arrow left"  onclick="scrollRow('rowFiltered',-1)">&#8592;</button>
          <div class="app-track" id="rowFiltered"></div>
          <button class="scroll-arrow right" onclick="scrollRow('rowFiltered', 1)">&#8594;</button>
        </div>
      </div>
    </div>

    <!-- Secciones principales -->
    <div id="mainSections">

      <div class="app-row">
        <h2 class="app-row-title">Nuevo en IA MASIVA</h2>
        <div class="scroll-wrapper">
          <button class="scroll-arrow left"  onclick="scrollRow('rowNuevo',-1)">&#8592;</button>
          <div class="app-track" id="rowNuevo"></div>
          <button class="scroll-arrow right" onclick="scrollRow('rowNuevo', 1)">&#8594;</button>
        </div>
      </div>

      <div class="app-row">
        <h2 class="app-row-title">Guías Premium</h2>
        <div class="scroll-wrapper">
          <button class="scroll-arrow left"  onclick="scrollRow('rowPremium',-1)">&#8592;</button>
          <div class="app-track" id="rowPremium"></div>
          <button class="scroll-arrow right" onclick="scrollRow('rowPremium', 1)">&#8594;</button>
        </div>
      </div>

      <div class="app-row">
        <h2 class="app-row-title">Tendencias</h2>
        <div class="scroll-wrapper">
          <button class="scroll-arrow left"  onclick="scrollRow('rowTendencias',-1)">&#8592;</button>
          <div class="app-track" id="rowTendencias"></div>
          <button class="scroll-arrow right" onclick="scrollRow('rowTendencias', 1)">&#8594;</button>
        </div>

  <script>
    // ── SUPABASE ──────────────────────────────────────────────
    const { createClient } = supabase;
    const sb = createClient(

      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5aXlnbmZheGllanRsZ2traXZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MTU2ODksImV4cCI6MjA5MjA5MTY4OX0.jfDgQK31XdmY4yd0hMjEgu6b408mGuUSld2-njAujQc'
    );

    const CATEGORIAS = [
      'LLM','Imagen y diseño','Video y animación','Audio, voz y música',
      'Investigación','Coding','Automatización','Marketing',
      'Atención al cliente','Finanzas','Desarrollo','Análisis de datos','Creación de contenido'
    ];

    let allGuides = [], userPurchases = [], isAdmin = false;
    let heroSlides = [], heroIndex = 0, heroTimer = null, heroSlidesRaw = [];

    // ── AUTH GUARD ────────────────────────────────────────────
    sb.auth.getSession().then(({ data: { session } }) => {
      if (!session) { window.location.href = 'index.html'; return; }
      initApp(session);
    });
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') window.location.href = 'index.html';
    });
    document.getElementById('appLogout').addEventListener('click', () => sb.auth.signOut());

    // ── NAVBAR SCROLL ─────────────────────────────────────────
    window.addEventListener('scroll', () => {
      document.getElementById('appNav').classList.toggle('scrolled', window.scrollY > 20);
    }, { passive: true });

    // ── SCROLL ROWS ───────────────────────────────────────────
    function scrollRow(id, dir) {
      document.getElementById(id).scrollBy({ left: dir * 600, behavior: 'smooth' });
    }

    // ── FILTERS ───────────────────────────────────────────────
    function setFilter(type, cat = null) {
      ['filterAll','filterGratis','filterPremium','filterCatBtn'].forEach(id =>
        document.getElementById(id).classList.remove('active')
      );
      document.querySelectorAll('.cat-menu-item').forEach(el => el.classList.remove('active'));

      if (type === 'all') {
        document.getElementById('filterAll').classList.add('active');
        document.getElementById('filteredSection').classList.remove('active');
        document.getElementById('mainSections').classList.remove('filtered');
        return;
      }

      if (type === 'gratis')  document.getElementById('filterGratis').classList.add('active');
      if (type === 'premium') document.getElementById('filterPremium').classList.add('active');
      if (type === 'cat')     { document.getElementById('filterCatBtn').classList.add('active'); }

      let filtered = [];
      if (type === 'gratis')  filtered = allGuides.filter(g => !g.es_premium);
      if (type === 'premium') filtered = allGuides.filter(g => g.es_premium);
      if (type === 'cat')     filtered = allGuides.filter(g => (g.categorias||[]).includes(cat));

      document.getElementById('filteredTitle').textContent =
        type === 'gratis' ? 'Guías gratuitas' : type === 'premium' ? 'Guías Premium' : cat;

      document.getElementById('rowFiltered').innerHTML = filtered.length
        ? filtered.map((g,i) => makeCard(g,i+1,false)).join('')
        : '<p class="app-empty">No hay guías aquí aún.</p>';

      document.getElementById('filteredSection').classList.add('active');
      document.getElementById('mainSections').classList.add('filtered');

      if (cat) {
        document.querySelectorAll('.cat-menu-item').forEach(el => {
          if (el.dataset.cat === cat) el.classList.add('active');
        });
      }
      closeCatMenu();
    }

    function toggleCatMenu() { document.getElementById('catMenu').classList.toggle('open'); }
    function closeCatMenu()  { document.getElementById('catMenu').classList.remove('open'); }
    document.addEventListener('click', e => { if (!e.target.closest('.cat-dropdown')) closeCatMenu(); });

    // ── CARD BUILDER ──────────────────────────────────────────
    function makeCard(guide, rank, showRank = false) {
      const purchased = userPurchases.includes(guide.id);
      const locked    = guide.es_premium && !purchased;
      const badgeHtml = purchased
        ? '<span class="app-card-badge badge-tuya">✓ Tuya</span>'
        : guide.es_premium
          ? '<span class="app-card-badge badge-premium" title="Premium">👑</span>'
          : '';
      const cats = (guide.categorias || []).slice(0,2).join(' · ');
      const adminControls = isAdmin ? `
        <div class="admin-card-controls">
          <button class="admin-card-btn edit" onclick="event.stopPropagation();editGuide('${guide.id}')">Editar</button>
          <button class="admin-card-btn del"  onclick="event.stopPropagation();deleteGuide('${guide.id}','${guide.titulo.replace(/'/g,"\\'")}')">Eliminar</button>
        </div>` : '';
      return `
        <div class="app-card${locked?' locked':''}" onclick="openGuide('${guide.id}',${locked})">
          ${guide.portada_url ? `<img src="${guide.portada_url}" class="app-card-cover"/>` : ''}
          ${adminControls}
          ${locked ? '<div class="app-card-lock">&#128274;</div>' : ''}
          ${showRank ? `<div class="app-card-rank">${rank}</div>` : ''}
          ${badgeHtml}
          <div class="app-card-info">
            <div class="app-card-tag">${cats}</div>
          </div>
        </div>`;
    }

    async function openGuide(id, locked) {
      if (locked) { alert('Esta es una guía Premium. Pronto podrás adquirirla.'); return; }
      const g = allGuides.find(g => g.id === id);
      if (!g?.contenido_url) return;
      try {
        const res  = await fetch(g.contenido_url);
        const html = await res.text();
        document.getElementById('guideViewerTitle').textContent = g.titulo;
        document.getElementById('guideFrame').srcdoc = html;
        document.getElementById('guideOverlay').classList.add('active');
        document.body.style.overflow = 'hidden';
      } catch(e) {
        alert('No se pudo cargar la guía. Intenta de nuevo.');
      }
    }

    function closeGuideViewer() {
      document.getElementById('guideOverlay').classList.remove('active');
      document.getElementById('guideFrame').srcdoc = '';
      document.body.style.overflow = '';
    }

    // ── HERO (carrusel, independiente de las guías) ────────────
    function goToUrl(url) {
      if (url) window.location.href = url;
    }

    function renderHeroSlide(i) {
      const s = heroSlides[i];
      if (!s) return;
      heroIndex = i;

      document.getElementById('heroBtn').textContent = s.ctaTexto || 'Comprar ahora';
      document.getElementById('heroBtn').onclick = e => { e.stopPropagation(); goToUrl(s.ctaUrl); };

      const hero = document.getElementById('appHero');
      hero.querySelectorAll('.app-hero-bg').forEach(el => el.remove());
      if (s.imgDesktop) {
        const picture = document.createElement('picture');
        picture.className = 'app-hero-bg';
        if (s.imgMobile) {
          const source = document.createElement('source');
          source.media = '(max-width: 720px)';
          source.srcset = s.imgMobile;
          picture.appendChild(source);
        }
        const img = document.createElement('img');
        img.src = s.imgDesktop;
        picture.appendChild(img);
        hero.insertBefore(picture, hero.firstChild);
        requestAnimationFrame(() => requestAnimationFrame(() => picture.classList.add('visible')));
      }

      document.querySelectorAll('#heroDots .hero-dot').forEach((d, idx) => d.classList.toggle('active', idx === i));
    }

    function restartHeroTimer() {
      if (heroTimer) clearInterval(heroTimer);
      if (heroSlides.length > 1) {
        heroTimer = setInterval(() => renderHeroSlide((heroIndex + 1) % heroSlides.length), 7000);
      }
    }

    function goToHeroSlide(i, e) {
      if (e) e.stopPropagation();
      renderHeroSlide(i);
      restartHeroTimer();
    }
    window.goToHeroSlide = goToHeroSlide;

    function buildHeroCarousel() {
      heroSlides = heroSlidesRaw
        .filter(s => s.activo)
        .map(s => ({ imgDesktop: s.imagen_desktop_url, imgMobile: s.imagen_mobile_url, ctaTexto: s.cta_texto, ctaUrl: s.cta_url }));

      const hero = document.getElementById('appHero');
      const heroContent = hero.querySelector('.app-hero-content');
      const emptyMsg = document.getElementById('heroEmptyMsg');

      if (!heroSlides.length) {
        heroContent.classList.add('hidden');
        emptyMsg.classList.remove('hidden');
        hero.classList.remove('clickable');
        hero.querySelectorAll('.app-hero-bg').forEach(el => el.remove());
        if (heroTimer) clearInterval(heroTimer);
        return;
      }
      heroContent.classList.remove('hidden');
      hero.classList.add('clickable');
      emptyMsg.classList.add('hidden');

      document.getElementById('heroDots').innerHTML = heroSlides.length > 1
        ? heroSlides.map((_,i) => `<button class="hero-dot" onclick="goToHeroSlide(${i}, event)"></button>`).join('')
        : '';

      renderHeroSlide(0);
      restartHeroTimer();
    }

    // ── RENDER SECCIONES ──────────────────────────────────────
    function renderAll() {
      const byNew = [...allGuides].sort((a,b) => new Date(b.created_at)-new Date(a.created_at));
      const premium = allGuides.filter(g=>g.es_premium).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));

      document.getElementById('rowNuevo').innerHTML     = byNew.length    ? byNew.map((g,i)=>makeCard(g,i+1)).join('')    : '<p class="app-empty">Pronto habrá contenido nuevo.</p>';
      document.getElementById('rowPremium').innerHTML   = premium.length  ? premium.map((g,i)=>makeCard(g,i+1)).join('')  : '<p class="app-empty">Próximamente guías Premium.</p>';
      document.getElementById('rowTendencias').innerHTML= allGuides.slice(0,10).length ? allGuides.slice(0,10).map((g,i)=>makeCard(g,i+1,true)).join('') : '<p class="app-empty">Pronto verás las tendencias aquí.</p>';

      // Categorías: top 6 por cantidad de guías
      const catCount = {};
      allGuides.forEach(g=>(g.categorias||[]).forEach(c=>{catCount[c]=(catCount[c]||0)+1;}));
      const topCats = Object.entries(catCount).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,6).map(([c])=>c);

      const catRows = document.getElementById('catRows');
      catRows.innerHTML = '';
      topCats.forEach(cat => {
        const rowId = 'row_'+cat.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
        const guides = allGuides.filter(g=>(g.categorias||[]).includes(cat));
        const div = document.createElement('div');
        div.className = 'app-row';
        div.innerHTML = `
          <h2 class="app-row-title">${cat}</h2>
          <div class="scroll-wrapper">
            <button class="scroll-arrow left"  onclick="scrollRow('${rowId}',-1)">&#8592;</button>
            <div class="app-track" id="${rowId}">${guides.map((g,i)=>makeCard(g,i+1)).join('')}</div>
            <button class="scroll-arrow right" onclick="scrollRow('${rowId}', 1)">&#8594;</button>
          </div>`;
        catRows.appendChild(div);
      });

      // Menú categorías (todas con guías)
      const catMenu = document.getElementById('catMenu');
      catMenu.innerHTML = '';
      Object.keys(catCount).sort().forEach(cat=>{
        const item = document.createElement('div');
        item.className='cat-menu-item'; item.textContent=cat; item.dataset.cat=cat;
        item.onclick=()=>setFilter('cat',cat);
        catMenu.appendChild(item);
      });

      buildHeroCarousel();
    }

    // ── ADMIN MODAL ───────────────────────────────────────────
    const adminModal = document.getElementById('adminModal');

    // Generar checkboxes de categorías
    const catsGrid = document.getElementById('catsGrid');
    CATEGORIAS.forEach(cat=>{
      const label = document.createElement('label');
      label.className='cat-check';
      label.innerHTML=`<input type="checkbox" value="${cat}" class="cat-cb"/> ${cat}`;
      catsGrid.appendChild(label);
    });

    function openAdminModal() { adminModal.classList.add('active'); document.body.style.overflow='hidden'; }
    function closeAdminModal() { adminModal.classList.remove('active'); document.body.style.overflow=''; resetForm(); }

    document.getElementById('btnNewGuide').addEventListener('click', ()=>{ document.getElementById('modalTitle').textContent='Nueva guía'; openAdminModal(); });
    document.getElementById('modalClose').addEventListener('click', closeAdminModal);
    document.getElementById('btnCancel').addEventListener('click', closeAdminModal);
    adminModal.addEventListener('click', e=>{ if(e.target===adminModal) closeAdminModal(); });

    function resetForm() {
      document.getElementById('guideForm').reset();
      document.getElementById('fId').value='';
      document.getElementById('portadaPreview').style.display='none';
      ['portadaName','htmlName','portadaActual','htmlActual','formMsg'].forEach(id=>document.getElementById(id).classList.add('hidden'));
      document.querySelectorAll('.cat-cb').forEach(cb=>cb.checked=false);
    }

    // File feedback
    document.getElementById('fPortada').addEventListener('change', function(){
      const f=this.files[0]; if(!f) return;
      const nm=document.getElementById('portadaName'); nm.textContent=f.name; nm.classList.remove('hidden');
      const reader=new FileReader(); reader.onload=e=>{ const img=document.getElementById('portadaPreview'); img.src=e.target.result; img.style.display='block'; }; reader.readAsDataURL(f);
    });
    document.getElementById('fHtml').addEventListener('change', function(){
      const f=this.files[0]; if(!f) return;
      const nm=document.getElementById('htmlName'); nm.textContent=f.name; nm.classList.remove('hidden');
    });

    // Upload a Storage
    async function uploadFile(bucket, file) {
      const ext=file.name.split('.').pop();
      const path=`${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
      const contentType = bucket === 'contenido' ? 'text/html' : file.type;
      const {error}=await sb.storage.from(bucket).upload(path, file, {upsert:true, contentType});
      if(error) throw new Error('Error subiendo archivo: '+error.message);
      return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
    }

    function showFormMsg(msg,type='error'){ const el=document.getElementById('formMsg'); el.textContent=msg; el.className='form-msg '+type; el.classList.remove('hidden'); }

    // Guardar guía
    document.getElementById('guideForm').addEventListener('submit', async e=>{
      e.preventDefault();
      const btn=document.getElementById('btnSave');
      btn.textContent='Guardando...'; btn.disabled=true;
      try {
        const id      = document.getElementById('fId').value;
        const titulo  = document.getElementById('fTitulo').value.trim();
        const desc    = document.getElementById('fDesc').value.trim();
        const premium = document.getElementById('fPremium').checked;
        const pub     = document.getElementById('fPublicada').checked;
        const cats    = [...document.querySelectorAll('.cat-cb:checked')].map(cb=>cb.value);
        const portFile= document.getElementById('fPortada').files[0];
        const htmlFile= document.getElementById('fHtml').files[0];

        const payload = { titulo, descripcion:desc, es_premium:premium, publicada:pub, categorias:cats };
        if(portFile) payload.portada_url   = await uploadFile('portadas', portFile);
        if(htmlFile) payload.contenido_url = await uploadFile('contenido', htmlFile);

        const {error} = id
          ? await sb.from('guides').update(payload).eq('id',id)
          : await sb.from('guides').insert(payload);

        if(error) throw new Error(error.message);
        showFormMsg(id?'Guía actualizada.':'Guía creada correctamente.','success');
        setTimeout(async()=>{ closeAdminModal(); await loadAndRender(); }, 1200);
      } catch(err){ showFormMsg(err.message); }
      finally { btn.textContent='Guardar guía'; btn.disabled=false; }
    });

    // Editar
    async function editGuide(id) {
      const {data:g}=await sb.from('guides').select('*').eq('id',id).single();
      if(!g) return;
      document.getElementById('modalTitle').textContent='Editar guía';
      document.getElementById('fId').value=g.id;
      document.getElementById('fTitulo').value=g.titulo||'';
      document.getElementById('fDesc').value=g.descripcion||'';
      document.getElementById('fPremium').checked=!!g.es_premium;
      document.getElementById('fPublicada').checked=!!g.publicada;
      document.querySelectorAll('.cat-cb').forEach(cb=>{ cb.checked=(g.categorias||[]).includes(cb.value); });
      if(g.portada_url){ const el=document.getElementById('portadaActual'); el.textContent='Portada actual: '+g.portada_url.split('/').pop(); el.classList.remove('hidden'); }
      if(g.contenido_url){ const el=document.getElementById('htmlActual'); el.textContent='HTML actual: '+g.contenido_url.split('/').pop(); el.classList.remove('hidden'); }
      openAdminModal();
    }

    // Eliminar
    async function deleteGuide(id, titulo) {
      if(!confirm(`¿Eliminar "${titulo}"? Esta acción no se puede deshacer.`)) return;
      const {error}=await sb.from('guides').delete().eq('id',id);
      if(error){ alert('Error: '+error.message); return; }
      await loadAndRender();
    }

    // Exponer funciones globalmente
    window.editGuide=editGuide; window.deleteGuide=deleteGuide;

    // ── HERO SLIDES ADMIN ──────────────────────────────────────
    const heroAdminModal = document.getElementById('heroAdminModal');

    function openHeroAdminModal() {
      renderHeroSlidesList();
      heroAdminModal.classList.add('active');
      document.body.style.overflow='hidden';
    }
    function closeHeroAdminModal() {
      heroAdminModal.classList.remove('active');
      document.body.style.overflow='';
      resetHeroForm();
    }
    document.getElementById('heroEditBtn').addEventListener('click', e => { e.stopPropagation(); openHeroAdminModal(); });
    document.getElementById('appHero').addEventListener('click', () => goToUrl(heroSlides[heroIndex]?.ctaUrl));
    document.getElementById('heroModalClose').addEventListener('click', closeHeroAdminModal);
    document.getElementById('heroBtnCancel').addEventListener('click', closeHeroAdminModal);
    heroAdminModal.addEventListener('click', e=>{ if(e.target===heroAdminModal) closeHeroAdminModal(); });

    function renderHeroSlidesList() {
      const list = document.getElementById('heroSlidesList');
      if (!heroSlidesRaw.length) {
        list.innerHTML = '<p class="hero-slide-empty">No hay imágenes en el hero todavía.</p>';
        return;
      }
      list.innerHTML = heroSlidesRaw.map(s => `
        <div class="hero-slide-row">
          <img class="hero-slide-thumb" src="${s.imagen_desktop_url}" />
          <div class="hero-slide-info">
            <div class="hero-slide-title">${s.cta_texto || 'Comprar ahora'}</div>
            <div class="hero-slide-meta">Orden ${s.orden} · ${s.activo ? 'Activa' : 'Inactiva'} · ${s.cta_url}</div>
          </div>
          <div class="table-actions">
            <button class="admin-card-btn edit" type="button" onclick="editHeroSlide('${s.id}')">Editar</button>
            <button class="admin-card-btn del" type="button" onclick="deleteHeroSlide('${s.id}')">Eliminar</button>
          </div>
        </div>
      `).join('');
    }

    function resetHeroForm() {
      document.getElementById('heroSlideForm').reset();
      document.getElementById('fHeroId').value='';
      document.getElementById('fHeroCtaTexto').value='Comprar ahora';
      document.getElementById('fHeroOrden').value='0';
      document.getElementById('fHeroActivo').checked=true;
      ['heroDesktopName','heroMobileName','heroDesktopActual','heroMobileActual','heroFormMsg'].forEach(id=>document.getElementById(id).classList.add('hidden'));
    }

    document.getElementById('fHeroDesktop').addEventListener('change', function(){
      const f=this.files[0]; if(!f) return;
      const nm=document.getElementById('heroDesktopName'); nm.textContent=f.name; nm.classList.remove('hidden');
    });
    document.getElementById('fHeroMobile').addEventListener('change', function(){
      const f=this.files[0]; if(!f) return;
      const nm=document.getElementById('heroMobileName'); nm.textContent=f.name; nm.classList.remove('hidden');
    });

    function showHeroFormMsg(msg,type='error'){ const el=document.getElementById('heroFormMsg'); el.textContent=msg; el.className='form-msg '+type; el.classList.remove('hidden'); }

    document.getElementById('heroSlideForm').addEventListener('submit', async e=>{
      e.preventDefault();
      const btn=document.getElementById('heroBtnSave');
      btn.textContent='Guardando...'; btn.disabled=true;
      try {
        const id       = document.getElementById('fHeroId').value;
        const ctaTexto = document.getElementById('fHeroCtaTexto').value.trim();
        const ctaUrl   = document.getElementById('fHeroCtaUrl').value.trim();
        const orden    = parseInt(document.getElementById('fHeroOrden').value,10) || 0;
        const activo   = document.getElementById('fHeroActivo').checked;
        const deskFile = document.getElementById('fHeroDesktop').files[0];
        const mobFile  = document.getElementById('fHeroMobile').files[0];

        if (!ctaUrl) throw new Error('Falta el link de destino (landing de pago).');
        if (!id && !deskFile) throw new Error('La imagen de escritorio es obligatoria.');

        const payload = { cta_texto: ctaTexto || 'Comprar ahora', cta_url: ctaUrl, orden, activo };
        if (deskFile) payload.imagen_desktop_url = await uploadFile('portadas', deskFile);
        if (mobFile)  payload.imagen_mobile_url  = await uploadFile('portadas', mobFile);

        const {error} = id
          ? await sb.from('hero_slides').update(payload).eq('id',id)
          : await sb.from('hero_slides').insert(payload);

        if(error) throw new Error(error.message);
        showHeroFormMsg(id?'Imagen actualizada.':'Imagen agregada al hero.','success');
        setTimeout(async()=>{ closeHeroAdminModal(); await loadAndRender(); }, 1000);
      } catch(err){ showHeroFormMsg(err.message); }
      finally { btn.textContent='Guardar imagen'; btn.disabled=false; }
    });

    async function editHeroSlide(id) {
      const s = heroSlidesRaw.find(x=>x.id===id);
      if(!s) return;
      document.getElementById('fHeroId').value=s.id;
      document.getElementById('fHeroCtaTexto').value=s.cta_texto || 'Comprar ahora';
      document.getElementById('fHeroCtaUrl').value=s.cta_url || '';
      document.getElementById('fHeroOrden').value=s.orden ?? 0;
      document.getElementById('fHeroActivo').checked=!!s.activo;
      if(s.imagen_desktop_url){ const el=document.getElementById('heroDesktopActual'); el.textContent='Actual: '+s.imagen_desktop_url.split('/').pop(); el.classList.remove('hidden'); }
      if(s.imagen_mobile_url){ const el=document.getElementById('heroMobileActual'); el.textContent='Actual: '+s.imagen_mobile_url.split('/').pop(); el.classList.remove('hidden'); }
    }

    async function deleteHeroSlide(id) {
      if(!confirm('¿Eliminar esta imagen del hero?')) return;
      const {error}=await sb.from('hero_slides').delete().eq('id',id);
      if(error){ alert('Error: '+error.message); return; }
      await loadAndRender();
      renderHeroSlidesList();
    }

    window.editHeroSlide=editHeroSlide; window.deleteHeroSlide=deleteHeroSlide;

    // ── CARGAR Y RENDERIZAR ───────────────────────────────────
    async function loadAndRender() {
      const guidesQuery = isAdmin
        ? sb.from('guides').select('*').order('created_at',{ascending:false})
        : sb.from('guides').select('*').eq('publicada',true).order('created_at',{ascending:false});
      const [{data:guides}, {data:slides}] = await Promise.all([
        guidesQuery,
        sb.from('hero_slides').select('*').order('orden',{ascending:true})
      ]);
      allGuides=guides||[];
      heroSlidesRaw=slides||[];
      renderAll();
    }

    // ── INIT ──────────────────────────────────────────────────
    async function initApp(session) {
      const nombre=session.user.user_metadata?.nombre||session.user.user_metadata?.full_name||session.user.email;
      document.getElementById('appNavName').textContent=nombre;

      // Verificar admin
      const {data:profile}=await sb.from('profiles').select('es_admin').eq('id',session.user.id).single();
      isAdmin=!!profile?.es_admin;
      if(isAdmin) {
        document.getElementById('btnNewGuide').classList.remove('hidden');
        document.getElementById('heroEditBtn').classList.remove('hidden');
      }

      // Compras del usuario
      const {data:purchases}=await sb.from('purchases').select('guide_id').eq('user_id',session.user.id);
      userPurchases=(purchases||[]).map(p=>p.guide_id);

      // Si es admin, cargar todas (incluye no publicadas)
      const guidesQuery = isAdmin
        ? sb.from('guides').select('*').order('created_at',{ascending:false})
        : sb.from('guides').select('*').eq('publicada',true).order('created_at',{ascending:false});
      const [{data:guides}, {data:slides}] = await Promise.all([
        guidesQuery,
        sb.from('hero_slides').select('*').order('orden',{ascending:true})
      ]);
      allGuides=guides||[];
      heroSlidesRaw=slides||[];

      renderAll();
    }
  </script>
</body>
</html>
