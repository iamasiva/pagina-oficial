<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Recurso del bootcamp · IA MASIVA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root { --black: #050505; --card: #0b1440; --line: rgba(255,255,255,0.1); --white: #fff; --gray: #D1D5DB; --muted: #9aa3b8; --blue: #2F6BFF; --cyan: #00E5FF; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--black); color: var(--white); line-height: 1.5; }
    body[data-cargando] main, body[data-cargando] .nav { visibility: hidden; }
    a { color: inherit; text-decoration: none; }
    h1, p { margin: 0; }
    .wrap { width: min(1100px, 100% - 32px); margin: 0 auto; }
    .nav { position: sticky; top: 0; z-index: 20; background: rgba(5,5,5,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .nav .wrap { height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 12px; white-space: nowrap; }
    .nav-logo { font-weight: 900; letter-spacing: 0.12em; }
    .nav a.l { color: var(--gray); font-size: 0.9rem; }
    .chip { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; border: 1px solid rgba(0,229,255,0.5); color: var(--cyan); margin-right: 10px; }
    main { padding: 20px 0 50px; }
    .cabeza { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px; margin-bottom: 14px; }
    .etq { font-size: 0.74rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--cyan); font-weight: 600; }
    h1 { font-size: clamp(1.3rem, 3vw, 1.8rem); font-weight: 800; margin-top: 4px; }
    .oculto { display: none !important; }
    .estado { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: center; }
    .estado img { width: 100%; border-radius: 12px; display: block; }
    .estado h2 { margin: 0 0 8px; font-size: 1.25rem; }
    .estado p { color: var(--gray); }
    .btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; background: var(--blue); color: #fff; border-radius: 10px; padding: 11px 16px; font-weight: 700; }
    .cargando { color: var(--muted); padding: 40px 0; text-align: center; }
    @media (max-width: 700px) { .estado { grid-template-columns: 1fr; } .estado img { max-width: 220px; } .chip { display: none; } }
  </style>
</head>
<body data-cargando="1">
  <div class="nav"><div class="wrap"><a class="nav-logo" href="app.html">IA MASIVA</a><span><span class="chip" id="chipAdmin" hidden>Vista previa admin</span><a class="l" href="recurso-bootcamp.html">← Volver al bootcamp</a></span></div></div>
  <main>
    <div class="wrap">
      <div class="cabeza"><div><span class="etq" id="etq">Recurso del bootcamp</span><h1 id="titulo">Cargando...</h1></div></div>
      <div class="cargando" id="cargando">Cargando el recurso...</div>
      <div class="estado oculto" id="pronto">
        <img id="prontoImg" alt="" />
        <div><h2 id="prontoTitulo"></h2><p id="prontoTexto"></p><a class="btn" href="recurso-bootcamp.html">Volver al bootcamp</a></div>
      </div>
    </div>
  </main>

  <script>
  // Todo dentro de una función: al reemplazar el documento con document.write el
  // ámbito global sigue vivo y las const de aquí chocarían con las del recurso.
  (async () => {
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5aXlnbmZheGllanRsZ2traXZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MTU2ODksImV4cCI6MjA5MjA5MTY4OX0.jfDgQK31XdmY4yd0hMjEgu6b408mGuUSld2-njAujQc';
    const sb = supabase.createClient('https://api.iamasiva.co', SUPABASE_ANON);
    const PRODUCT_ID = '6c01d354-e05d-47be-a6d6-3075abcc16d3';
    const LANDING = 'bootcamp.html';
    const PORTADAS = 'https://iyiygnfaxiejtlgkkivs.supabase.co/storage/v1/object/public/portadas/';
    // Recursos del bootcamp: el slug es la dirección definitiva (bootcamp-recurso.html?r=slug).
    // El contenido llega cuando exista la guía con ese slug en la tabla guides.
    const RECURSOS = {
      '42-formatos-de-respuesta':        { nombre: '42 formatos de respuesta',        clase: 1, portada: PORTADAS + 'bootcamp-portada-42-formatos-1793023500.jpg' },
      '61-instrucciones-para-imagenes':  { nombre: '61 instrucciones para imágenes',  clase: 1, portada: PORTADAS + 'bootcamp-portada-61-instrucciones-1793023500.jpg' },
      '25-agentes-de-ia':                { nombre: '25 agentes de IA con Gemini', clase: 3, portada: PORTADAS + 'bootcamp-portada-25-agentes-1793050000.jpg' },
      'mapa-de-las-ia-de-google':        { nombre: 'El mapa de las IA de Google',     clase: 1, portada: PORTADAS + 'bootcamp-portada-mapa-ia-google-1793023500.jpg' },
    };
    const $ = (id) => document.getElementById(id);

    // El recurso se muestra como PÁGINA COMPLETA, no dentro de un iframe: un solo
    // scroll, avisos y diálogos en su sitio y las rutas internas (#...) en la URL
    // real. Solo se añade un botón fijo para volver al bootcamp.
    function mostrarCompleto(html) {
      const volver = '<a class="im-volver" href="recurso-bootcamp.html"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>Volver al bootcamp</a>'
        + '<style>.im-volver{position:fixed;left:16px;bottom:16px;z-index:2147483000;display:inline-flex;align-items:center;gap:8px;background:#192333;color:#fff;text-decoration:none;font:600 14px/1 "Google Sans Flex","Google Sans","Segoe UI",Roboto,system-ui,sans-serif;padding:11px 16px;border-radius:999px;box-shadow:0 12px 30px rgba(25,35,51,.28)}.im-volver:hover{background:#246bfd;color:#fff}@media print{.im-volver{display:none}}</style>';
      const doc = /<body[^>]*>/i.test(html) ? html.replace(/<body[^>]*>/i, (m) => m + volver) : volver + html;
      document.open(); document.write(doc); document.close();
    }

    async function init() {
      const slug = String(new URLSearchParams(location.search).get('r') || '').trim();
      const recurso = RECURSOS[slug];
      if (!recurso) { location.replace('recurso-bootcamp.html'); return; }
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { location.replace('index.html'); return; }
      const [perfil, compra, cfg] = await Promise.all([
        sb.from('profiles').select('es_admin').eq('id', session.user.id).maybeSingle(),
        sb.from('purchases').select('id').eq('product_id', PRODUCT_ID).eq('estado', 'APROBADA').limit(1).maybeSingle(),
        sb.from('bootcamp_config').select('admin_only').eq('product_id', PRODUCT_ID).maybeSingle(),
      ]);
      const esAdmin = !!perfil.data?.es_admin;
      if (!esAdmin && (!compra.data || !cfg.data || cfg.data.admin_only)) { location.replace(LANDING); return; }
      try { if (esAdmin) localStorage.setItem('im_es_admin', '1'); } catch (_) {}
      if (esAdmin) $('chipAdmin').hidden = false;
      $('titulo').textContent = recurso.nombre; document.title = `${recurso.nombre} · Bootcamp · IA MASIVA`;
      document.body.removeAttribute('data-cargando');

      const { data: guia } = await sb.from('guides').select('id, titulo, contenido_url').eq('slug', slug).maybeSingle();
      if (!guia?.contenido_url) {
        $('cargando').classList.add('oculto');
        $('prontoImg').src = recurso.portada; $('prontoTitulo').textContent = recurso.nombre;
        $('prontoTexto').textContent = `Este recurso se entrega en la clase ${recurso.clase}. Cuando esté publicado lo vas a encontrar aquí mismo, en esta dirección.`;
        $('pronto').classList.remove('oculto');
        return;
      }
      try {
        const res = await fetch(guia.contenido_url);
        if (!res.ok) throw new Error('carga');
        const html = await res.text();
        // La apertura se registra ANTES de reemplazar el documento (si no, la petición se cancela)
        if (localStorage.getItem('im_es_admin') !== '1') { try { await sb.from('aperturas').insert({ user_id: session.user.id, guide_id: guia.id, product_id: PRODUCT_ID }); } catch (_) {} }
        mostrarCompleto(html);
      } catch (_) {
        $('cargando').textContent = 'No se pudo cargar el recurso. Intenta de nuevo.';
      }
    }
    init().catch(() => location.replace(LANDING));
  })();
  </script>
</body>
</html>
